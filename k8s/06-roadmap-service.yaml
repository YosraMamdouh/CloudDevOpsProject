apiVersion: apps/v1
kind: Deployment
metadata:
  name: roadmap-service
  namespace: ivolve
spec:
  replicas: 2
  selector:
    matchLabels:
      app: roadmap-service
  template:
    metadata:
      labels:
        app: roadmap-service
    spec:
      containers:
        - name: roadmap-service
          image: 000000000000.dkr.ecr.us-east-1.localhost:5100/ivolve/roadmap-service:4
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: roadmap-service
  namespace: ivolve
spec:
  type: ClusterIP
  selector:
    app: roadmap-service
  ports:
    - port: 8080
      targetPort: 8080

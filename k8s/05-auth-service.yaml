apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ivolve
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 000000000000.dkr.ecr.us-east-1.localhost:5100/ivolve/auth-service:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: ivolve-config
            - secretRef:
                name: ivolve-secret
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ivolve
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - port: 5000
      targetPort: 5000

---
- name: Install Docker and required dependencies
  apt:
    name:
      - docker.io
      - docker-compose-v2
    update_cache: yes
    state: present

- name: Add jenkins and ubuntu users to docker group
  user:
    name: "{{ item }}"
    groups: docker
    append: yes
  loop:
    - jenkins
    - ubuntu
  ignore_errors: yes

- name: Ensure Docker service is started and enabled
  service:
    name: docker
    state: started
    enabled: yes

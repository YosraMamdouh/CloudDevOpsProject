---
- name: Install dependencies for Trivy
  apt:
    name:
      - wget
      - apt-transport-https
      - gnupg
      - lsb-release
    state: present

- name: Add Trivy GPG key
  shell: wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | tee /usr/share/keyrings/trivy.gpg > /dev/null
  args:
    creates: /usr/share/keyrings/trivy.gpg

- name: Add Trivy repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main"
    state: present

- name: Install Trivy
  apt:
    name: trivy
    update_cache: yes
    state: present
